[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "filtergap"
version = "0.1.0"
description = "Catch bot and spam mentions that slip through budget-tier listening tools: account heuristics, entropy screening, SimHash clustering, and a logistic layer."
readme = "README.md"
license = "MIT"
authors = [{ name = "hexsyro", email = "hexsyro@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["bot-detection", "spam", "data-quality", "moderation", "audit", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
filtergap = "filtergap.cli:main"

[project.urls]
Homepage = "https://github.com/hexsyro/FilterGap"
Repository = "https://github.com/hexsyro/FilterGap"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
